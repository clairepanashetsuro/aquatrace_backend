[project]
name = "Your-Project-Title"
version = "0.1.0"
description = "Your Project Description"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pydantic[email]>=2.6",
    "pydantic-settings>=2.2",
    "pyjwt>=2.8",
    "pwdlib[argon2]>=0.2",
    "python-multipart>=0.0.9",
    "alembic>=1.20.0",
    "psycopg[binary]>=3.3.6",
    "authlib>=1.8.0",
    "slowapi>=0.1.10",
    "cryptography>=50.0.2",
    "google-genai>=2.31.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.9",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "httpx2>=2.0",
]

[tool.uv]
package = false
exclude-newer = "7 days"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    "B008",  # Allow Depends() in argument defaults for FastAPI dependency injection
]
